name: Repeat

on:
  pull_request:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - run: brew install tmux
      - run: sysctl -n hw.ncpu && uptime
      - run: swift test --help | grep -i -E "parallel|width" || true
      - run: bin/test
