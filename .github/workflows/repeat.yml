name: Repeat

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: repeat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repeat:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        width: [2, 3]
        run: [1, 2, 3, 4]
    env:
      SWT_EXPERIMENTAL_MAXIMUM_PARALLELIZATION_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install tmux
      - run: sysctl -n hw.ncpu && uptime
      - run: bin/test
