name: Test

on:
  pull_request:
    # A draft PR runs no macOS job, so marking it ready starts the run that
    # tests it.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Each runner runs one job, so the machine-wide build queue is off.
env:
  SB_BUILD_SLOTS: 0
  # The number of swift-test parts. bin/lib/ci-jobs picks which of them run.
  SB_CI_PARTS: 4

concurrency:
  # Draft runs have their own group, so a draft run never cancels the run that
  # marking the PR ready starts, whichever reaches GitHub first.
  group: test-${{ github.ref }}${{ github.event.pull_request.draft && '-draft' || '' }}
  cancel-in-progress: true

jobs:
  # Decides which macOS jobs the change runs (bin/lib/ci-jobs). A draft PR
  # runs none, and a push to main runs all of them. A ready PR runs the
  # swift-test parts and gui-test that its changed files can affect. A
  # skipped job counts as passed, so a PR whose files no job reads still gets
  # passing checks.
  changes:
    # The draft name keeps a later draft run from hiding a failed changes check
    # of the ready run on the same commit.
    name: ${{ github.event.pull_request.draft && 'changes (draft)' || 'changes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.jobs.outputs.parts }}
      gui: ${{ steps.jobs.outputs.gui }}
    steps:
      - uses: actions/checkout@v4
      - id: jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          names='.filename, (.previous_filename // empty)'
          package=$RUNNER_TEMP/package.json
          # The PR API lists at most 3000 files. A compare lists at most 300
          # and does not say how many it left out, so a full page runs every
          # job.
          if [ "$DRAFT" = true ]; then
            mode=draft files='' count=0
          elif [ -n "$PR" ]; then
            mode='pr'
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq ".[] | $names")
            count=$PR_FILES
            # bin/lib/ci-jobs runs every job when the package can't be read.
            swift package dump-package >"$package" || echo "::warning::swift package dump-package failed, so every job runs"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            mode=push
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq ".files[] | $names")
            count=$(grep -c . <<<"$files" || true)
            if [ "$count" -ge 300 ]; then count=0; fi
          else
            mode=push files='' count=0
          fi
          echo "$files"
          bin/lib/ci-jobs "$mode" "$count" "$package" <<<"$files" | tee -a "$GITHUB_OUTPUT"

  # The suite takes longer than one 3-CPU runner can finish within the time
  # limit, so the matrix splits it across runners. Each part builds the tests
  # and runs its share of them (bin/lib/shard-plan). The last part runs the
  # unit test targets and MeasureTests. The parts before it run the
  # integration suites. The matrix holds only the parts that the changes job
  # picked.
  swift-test:
    # GitHub names a skipped job's check after this expression's text, not its
    # value. A draft run's skipped checks therefore never share a name with the
    # checks of the ready run on the same commit, so they never hide its
    # results. The draft names apply if GitHub evaluates the expression.
    name: ${{ github.event.pull_request.draft && 'swift-test (draft)' || format('swift-test ({0})', matrix.part) }}
    needs: changes
    if: needs.changes.outputs.parts != '[]'
    runs-on: macos-26
    # The build alone takes up to 17 minutes on a loaded runner.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.changes.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: brew install tmux
      - run: tmux -V
      - run: sysctl -n hw.ncpu hw.memsize && uptime
      # Runs bin/test's build command. bin/test then finds the build up to date.
      # A warning in Sources or Tests fails the job. A warning inside a macro
      # expansion, such as an @Test's arguments, prints without a path. The
      # check therefore also matches lines that start with "macro expansion".
      # The check skips dependency checkouts, which sit under .build.
      - name: Build without warnings in Sources and Tests
        shell: bash
        run: |
          source bin/lib/swift-testing.sh
          build_tests 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -E '/(Sources|Tests)/[^:]+:[0-9]+:[0-9]+: warning:|^macro expansion [^:]+:[0-9]+:[0-9]+: warning:' "$RUNNER_TEMP/build.log" | grep -v '/\.build/'; then
            echo "::error::The build has warnings in Sources or Tests."
            exit 1
          fi
      # The runner has 3 CPUs, so each shard runs min(4, 3 - 1) = 2 integration
      # tests at once (SB_TEST_SLOTS in bin/test). The job sets no value. A
      # higher value would count as 2, because the width never exceeds one less
      # than the CPU count.
      - run: bin/test --shards 4 --part "${{ matrix.part }}/$SB_CI_PARTS"

  # bin/test-gui drives the real app, so it needs a logged-in session with a
  # display. GitHub's macOS runners log in a user. The job leaves out the
  # drops check. On the runner, that check's click on Send does not send the
  # message. The same check passes on a developer's Mac.
  gui-test:
    name: ${{ github.event.pull_request.draft && 'gui-test (draft)' || 'gui-test' }}
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install tmux
      - run: SB_GUI_SKIP=drops bin/test-gui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test
          path: .build/gui-test
          if-no-files-found: ignore
