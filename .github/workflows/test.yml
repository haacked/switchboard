name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the change can affect a build or a test. Only the
  # Markdown files at the repository root cannot, because no build or test
  # reads them. A skipped swift-test job counts as passed, so a docs-only PR
  # still gets passing checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
            count=$(gh api "repos/$REPO/pulls/$PR" --jq .changed_files)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename')
            count=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files | length')
          else
            files=
            count=0
          fi
          echo "$files"
          # The APIs list at most 3000 files for a PR and 300 for a compare.
          # A list that comes back empty or short runs the tests.
          listed=$(grep -c . <<<"$files" || true)
          other=$(grep -c -v -E '^[^/]+\.md$' <<<"$files" || true)
          code=true
          if [ "$count" -gt 0 ] && [ "$listed" -eq "$count" ] && [ "$other" -eq 0 ]; then
            code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  swift-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shards: [2, 4]
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: brew install tmux
      - run: tmux -V
      - run: sysctl -n hw.ncpu hw.memsize && uptime
      - name: Sample CPU
        run: nohup iostat -w 30 > "$RUNNER_TEMP/iostat.txt" 2>&1 &
      - run: bin/test --shards ${{ matrix.shards }}
      - name: CPU samples
        if: always()
        run: cat "$RUNNER_TEMP/iostat.txt"
