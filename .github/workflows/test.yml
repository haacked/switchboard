name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Each runner runs one job, so the machine-wide build queue is off.
env:
  SB_BUILD_SLOTS: 0

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the change can affect a build or a test. Only the
  # Markdown files at the repository root cannot, because no build or test
  # reads them. A skipped swift-test job counts as passed, so a docs-only PR
  # still gets passing checks.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          names='.filename, (.previous_filename // empty)'
          # The PR API lists at most 3000 files. A compare lists at most 300
          # and does not say how many it left out, so a full page runs the
          # tests.
          if [ -n "$PR" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq ".[] | $names")
            count=$PR_FILES
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq ".files[] | $names")
            count=$(grep -c . <<<"$files" || true)
            if [ "$count" -ge 300 ]; then count=0; fi
          else
            files=
            count=0
          fi
          echo "$files"
          # A list that comes back empty, short, or long runs the tests. A
          # rename lists its old path too, so a renamed file in a PR runs them.
          listed=$(grep -c . <<<"$files" || true)
          other=$(grep -c -v -E '^[^/]+\.md$' <<<"$files" || true)
          code=true
          if [ "$count" -gt 0 ] && [ "$listed" -eq "$count" ] && [ "$other" -eq 0 ]; then
            code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # The suite takes longer than one 3-CPU runner can finish within the time
  # limit, so the matrix splits it across runners. Each part builds the tests
  # and runs its share of them (bin/lib/shard-plan).
  swift-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: brew install tmux
      - run: tmux -V
      - run: sysctl -n hw.ncpu hw.memsize && uptime
      # Runs bin/test's build command. bin/test then finds the build up to date.
      # A warning in Sources or Tests fails the job. A warning inside a macro
      # expansion, such as an @Test's arguments, prints without a path. The
      # check therefore also matches lines that start with "macro expansion".
      # The check skips dependency checkouts, which sit under .build.
      - name: Build without warnings in Sources and Tests
        shell: bash
        run: |
          source bin/lib/swift-testing.sh
          build_tests 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -E '/(Sources|Tests)/[^:]+:[0-9]+:[0-9]+: warning:|^macro expansion [^:]+:[0-9]+:[0-9]+: warning:' "$RUNNER_TEMP/build.log" | grep -v '/\.build/'; then
            echo "::error::The build has warnings in Sources or Tests."
            exit 1
          fi
      - run: bin/test --shards 4 --part ${{ matrix.part }}/2

  # bin/test-gui drives the real app, so it needs a logged-in session with a
  # display. GitHub's macOS runners log in a user. The job leaves out the
  # drops check. On the runner, that check's click on Send does not send the
  # message. The same check passes on a developer's Mac.
  gui-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install tmux
      - run: SB_GUI_SKIP=drops bin/test-gui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test
          path: .build/gui-test
          if-no-files-found: ignore
